if(!$('#ioAdd')){const b=document.createElement('button');b.id='ioAdd';b.className='pri';b.textContent='إضافة للخريطة';$('#ioIn').before(b)}
if(!$('#ioF')){const f=document.createElement('input');f.type='file';f.id='ioF';f.accept='.json,application/json';$('#ioT').before(f);
  f.onchange=async e=>{const x=e.target.files[0];if(x){$('#ioT').value=await x.text();toast('تم تحميل الملف')}}}
$('#ioIn').textContent='استبدال الكل';
const snap=()=>JSON.stringify(S);
const snaps=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');

/* --- لقطات محلية (تبقى حتى لو فشل الحفظ السحابي) --- */
function keep(reason,force){try{const a=snaps(),d=snap();
  if(a[0]&&(a[0].d===d||(!force&&Date.now()-a[0].t<60000)))return;
  a.unshift({t:Date.now(),r:reason,n:S.nodes.length,d});
  while(a.length){try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,MAXS)));return}catch(e){a.pop()}}}catch(e){}}

/* --- تنزيل ملف --- */
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const backupFile=why=>dl(`خريطة-الأحياء-${why}-${stamp()}.json`,snap());

/* --- التحقق من ملف الاستيراد (يقبل الصيغة القديمة: كائن فيه nodes أو مصفوفة) --- */
function parseInput(){let d;
  try{d=JSON.parse($('#ioT').value)}catch(e){toast('الملف ليس JSON صالحاً: تحققي من الأقواس والفواصل');return null}
  if(Array.isArray(d))d={nodes:d};
  if(!d||typeof d!=='object'||!Array.isArray(d.nodes)){toast('البنية غير صحيحة: لا يوجد حقل nodes');return null}
  const seen=new Set(),nodes=[];let bad=0,dup=0;
  d.nodes.forEach(n=>{if(!n||typeof n!=='object'||Array.isArray(n)){bad++;return}
    const m={...n};m.id=String(m.id||uid());if(seen.has(m.id)){dup++;return}seen.add(m.id);
    m.title=m.title==null?'':String(m.title);m.x=+m.x||0;m.y=+m.y||0;nodes.push(m)});
  if(!nodes.length){toast('لا توجد بطاقات صالحة في الملف');return null}
  return{d,nodes,bad,dup}}
const note=r=>(r.bad||r.dup?` (تم تجاهل ${r.bad} غير صالح و${r.dup} مكرر)`:'');

$('#ioIn').onclick=async()=>{const r=parseInput();if(!r)return;
  if(await ask(`سيتم استبدال الخريطة الحالية (${S.nodes.length} بطاقة) بـ ${r.nodes.length} بطاقة${note(r)}. ستُنزَّل نسخة احتياطية من الحالية أولاً.`,{ok:'استبدال'})){
    keep('قبل الاستبدال',1);backupFile('قبل-الاستبدال');S={...S,...r.d,nodes:r.nodes};
    show('#ioModal',false);render();fit();queueSave()}};

$('#ioAdd').onclick=async()=>{const r=parseInput();if(!r)return;
  const ids=new Set(S.nodes.map(n=>n.id)),upd=r.nodes.filter(n=>ids.has(n.id)).length,add=r.nodes.length-upd;
  if(await ask(`إضافة ${add} بطاقة جديدة وتحديث ${upd} موجودة${note(r)}. لن يُحذف شيء.`,{ok:'متابعة'})){
    keep('قبل الإضافة',1);
    r.nodes.forEach(n=>{const i=S.nodes.findIndex(x=>x.id===n.id);if(i>=0)S.nodes[i]={...S.nodes[i],...n};else S.nodes.push(n)});
    show('#ioModal',false);render();fit();queueSave();toast('تمت الإضافة')}};

/* --- تراجع / إعادة (يشمل النص واللون والفروع والترتيب والثيم) --- */
let hist=[snap()],pos=0,busy=0,pend=0,pt;
const _q=queueSave;
queueSave=function(){
  if(!busy){const s=snap();if(s!==hist[pos]){hist=hist.slice(0,pos+1);hist.push(s);if(hist.length>60)hist.shift();pos=hist.length-1}}
  keep('حفظ تلقائي');pend=1;clearTimeout(pt);pt=setTimeout(()=>pend=0,3500);_q()};
function go(d){const p=pos+d;if(p<0||p>=hist.length)return toast(d<0?'لا يوجد ما يُتراجع عنه':'لا يوجد ما يُعاد');
  pos=p;busy=1;try{S=JSON.parse(hist[pos]);render();_q();toast(d<0?'تم التراجع':'تمت الإعادة')}catch(e){toast('تعذر التراجع')}busy=0}

/* --- استعادة من اللقطات المحلية --- */
async function restore(){const a=snaps();if(!a.length)return toast('لا توجد نسخ محلية بعد');
  const list=a.map((x,i)=>`${i+1}) ${new Date(x.t).toLocaleString('ar')} - ${x.n} بطاقة - ${x.r}`).join('\n');
  const v=await ask('اكتبي رقم النسخة المراد استعادتها:\n'+list,{input:1,val:'1',ok:'استعادة'});const i=parseInt(v,10)-1;
  if(!(i>=0&&i<a.length))return;keep('قبل الاستعادة',1);
  try{S={...S,...JSON.parse(a[i].d)};render();fit();queueSave();toast('تمت الاستعادة')}catch(e){toast('النسخة تالفة')}}

/* --- أزرار الشريط والاختصارات --- */
const cs=$('#cs');
[['↶ تراجع',()=>go(-1)],['↷ إعادة',()=>go(1)],['⬇ نسخة احتياطية',()=>backupFile('نسخة')],['⟲ استعادة',restore]].forEach(([t,f])=>{
  const b=document.createElement('button');b.textContent=t;b.onclick=f;cs.parentNode.insertBefore(b,cs)});
addEventListener('keydown',e=>{if(!admin||!(e.ctrlKey||e.metaKey)||e.target.closest('input,textarea'))return;
  const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();go(e.shiftKey?1:-1)}else if(k==='y'){e.preventDefault();go(1)}});
addEventListener('beforeunload',e=>{if(pend){e.preventDefault();e.returnValue=''}});
keep('عند الفتح');
})();

/* ==========================================================
   إضافة ٢: الهوية البصرية (ثيمات جديدة، اختيار الخط، فاتح/داكن، إعادة الافتراضي)
   تُلصق بعد safety-addon.js وقبل وسم script الأخير.
   تُحفظ الإعدادات داخل S (font, mode, theme) ولا تمس بيانات البطاقات.
   ========================================================== */
(()=>{
/* --- ثيمات جاهزة جديدة (تظهر تلقائياً في نافذة 🎨 الثيمات) --- */
Object.assign(TH,{
  botanical:mk('نباتي','#f4f1e4','#e1ebd3','#fffdf6','#1f3a2a','#2f7d4f'),
  scientific:mk('علمي','#f2f7fc','#d9e8f7','#ffffff','#10283f','#1e6fc0'),
  sea:mk('بحري','#eaf7f5','#c9ece6','#ffffff','#0e3a3a','#0f9d8a'),
  minimal:mk('بسيط','#fafafa','#ececec','#ffffff','#222222','#5b6cff'),
  warm:mk('أكاديمي دافئ','#fbf3e2','#efdcb4','#fffaf0','#4a3320','#b8862b')});

/* --- الخطوط --- */
const FONTS=[['Tajawal','تجوال'],['Cairo','القاهرة'],['IBM Plex Sans Arabic','IBM Plex'],['Noto Naskh Arabic','نسخ']];
function loadFont(f){const id='f_'+f.replace(/\s/g,'');if(document.getElementById(id))return;
  const l=document.createElement('link');l.id=id;l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+f.replace(/ /g,'+')+':wght@400;500;700;800&display=swap';document.head.appendChild(l)}

/* --- تطبيق الخط والوضع فوق الثيم الأصلي (بدون تعديل applyTheme الأصلية) --- */
const _apply=applyTheme;
applyTheme=function(){_apply();
  const r=document.documentElement.style,f=S.font||'Tajawal';
  loadFont(f);r.setProperty('--font',`'${f}',sans-serif`);
  const t=themeObj(),isDark=lum(t.bg)<.5,m=S.mode||'auto';
  if(m==='auto'||(m==='dark')===isDark)return;
  const a=t.acc,v=m==='light'
    ?{bg:mix(a,'#ffffff',.93),bg2:mix(a,'#ffffff',.82),card:'#ffffff',text:mix(a,'#000000',.8)}
    :{bg:mix(a,'#000000',.9),bg2:mix(a,'#000000',.78),card:mix(a,'#000000',.84),text:mix(a,'#ffffff',.9)};
  Object.entries({...v,muted:mix(v.text,v.card,.42),line:mix(v.text,v.card,.86)}).forEach(([k,c])=>r.setProperty('--'+k,c))};

/* --- نافذة الخط والوضع --- */
function openLook(){let m=document.getElementById('lookModal');
  if(!m){m=document.createElement('div');m.id='lookModal';m.className='modal hidden';m.style.zIndex=70;m.innerHTML='<div class="box"></div>';document.body.appendChild(m)}
  const b=m.firstChild;
  b.innerHTML='<h2>الخط والوضع</h2><small>الخط</small><div class="chips" id="lkF"></div><small>الوضع</small><div class="chips" id="lkM"></div><div class="row"><button id="lkR">إعادة الهوية للافتراضي</button><button id="lkX" class="pri">إغلاق</button></div>';
  chips($('#lkF'),FONTS,S.font||'Tajawal',k=>{S.font=k;applyTheme();queueSave()});
  chips($('#lkM'),[['auto','حسب الثيم'],['light','فاتح'],['dark','داكن']],S.mode||'auto',k=>{S.mode=k;applyTheme();queueSave()});
  $('#lkR').onclick=async()=>{if(await ask('إعادة الثيم والخط والوضع إلى الافتراضي؟ لا تتأثر الخرائط.',{ok:'إعادة'})){
    S.theme='dawn';S.tc=null;S.font='Tajawal';S.mode='auto';render();queueSave();openLook()}};
  $('#lkX').onclick=()=>show('#lookModal',false);show('#lookModal')}

const cs=$('#cs'),btn=document.createElement('button');
btn.textContent='Aa الخط والوضع';btn.onclick=openLook;cs.parentNode.insertBefore(btn,cs);
})();


/* ==========================================================
   إضافة ٣: الصفحة الرئيسية + البطاقات + الدروس المستقلة (قراءة فقط للزائر)
   تُخزَّن البطاقات والدروس داخل نفس كائن الخريطة S (S.cards, S.lessons)
   فلا يلزم أي تعديل على جداول Supabase. الحفظ يمر عبر queueSave الموجود (يتطلب الرمز).
   ========================================================== */
(()=>{
S.cards=S.cards||[];S.lessons=S.lessons||[];
const css=document.createElement('style');css.textContent=`
#home{position:fixed;inset:0;z-index:15;overflow:auto;background:radial-gradient(circle at 70% 20%,var(--bg2),var(--bg) 75%);padding:max(64px,env(safe-area-inset-top)) 16px 96px}
#home h1{margin:0;color:var(--accent);font-size:clamp(26px,5vw,42px)}#home h2{margin:26px 0 12px}#home .sub{color:var(--muted);margin:4px 0 14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 6px 20px var(--glow)}
.hcard img{width:100%;height:130px;object-fit:cover;display:block}.hb{padding:12px}.hb h3{margin:4px 0}.hb p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.hb small{color:var(--accent)}
#lbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:62px;z-index:45;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:6px 10px}
.mrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:8px}
.mrow small{color:var(--muted)}.mrow button{padding:4px 9px}
.box select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px}`;
document.head.appendChild(css);
const home=document.createElement('div');home.id='home';home.className='hidden';document.body.appendChild(home);
const lbar=document.createElement('div');lbar.id='lbar';lbar.className='hidden';
lbar.innerHTML='<button id="lBack">← رجوع</button><b id="lT"></b>';document.body.appendChild(lbar);
const MOD=(id,z)=>{let m=document.getElementById(id);if(!m){m=document.createElement('div');m.id=id;m.className='modal hidden';m.style.zIndex=z;m.innerHTML='<div class="box"></div>';document.body.appendChild(m)}return m};
const box=(id,z)=>MOD(id,z).firstChild,close=id=>{const e=document.getElementById(id);if(e)e.classList.add('hidden')};
const fbox=()=>{const b=box('frm',85);show('#frm');return b};
const clone=o=>JSON.parse(JSON.stringify(o)),sub=id=>{const rm=new Set([id]);let ch=1;while(ch){ch=0;S.nodes.forEach(x=>{if(!rm.has(x.id)&&rm.has(x.parent)){rm.add(x.id);ch=1}})}return rm};
const visible=()=>S.cards.filter(c=>!c.hidden&&(!c.lesson||(S.lessons.find(l=>l.id===c.lesson)||{}).pub!==false));
let live=null;

/* --- حماية: لا حفظ ولا مزامنة سحابية أثناء عرض درس مستقل --- */
const _q=queueSave;queueSave=function(){if(live)return;_q()};
const _f=fetchData;fetchData=async function(){if(live)return null;return _f()};

/* ===== الصفحة الرئيسية ===== */
const GR=['#7c5cff','#ff7a59','#16a085','#2b8fd1','#e0568f','#c2791d'];
const grad=c=>{let h=0;for(const ch of String(c.id))h=(h*31+ch.charCodeAt(0))>>>0;return `linear-gradient(135deg,${GR[h%6]},${GR[(h>>3)%6]})`};
const card=c=>`<article class="hcard" data-id="${c.id}" data-q="${esc([c.title,c.desc,c.subject,c.type].join(' ').toLowerCase())}"><div class="hm" style="${c.img?`background-image:url('${c.img}')`:`background:${grad(c)}`}">${c.img?'':`<span>${esc((c.title||'?').trim().charAt(0))}</span>`}</div><div class="hb"><div class="hc">${[c.type,c.subject].filter(Boolean).map(t=>`<i>${esc(t)}</i>`).join('')}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><b>${c.lesson?'فتح الدرس ←':'التفاصيل ←'}</b></div></article>`;
function showHome(v,prev){$('#hud').style.display=v?'none':'';if(!v)return show('#home',false);
  const vis=visible(),latest=vis.filter(c=>c.latest),feat=vis.filter(c=>c.featured);
  const lat=S.homeOrder==='manual'?latest:[...latest].sort((a,b)=>(b.ts||0)-(a.ts||0));
  const sec=(t,l,cls)=>l.length?`<section><h2>${t}</h2><div class="hgrid ${cls||''}">${l.map(card).join('')}</div></section>`:'';
  home.innerHTML=`<header class="hh"><div class="hw"><b class="brand">${esc(S.title)}</b><span class="sp"></span>${prev?'<button id="hClose">✕ إغلاق المعاينة</button>':''}<button id="hMap" class="pri">الخريطة الكاملة</button></div></header><div class="hw"><div class="hero"><h1>${esc(S.title)}</h1><p>${esc(S.sub)}</p><input id="hQ" type="search" placeholder="ابحثي عن ملخص أو درس..."></div>${sec('أبرز الملخصات',feat,'big')}${sec('أحدث الملخصات',lat)}${vis.length?'':'<p class="empty">لا توجد ملخصات منشورة بعد</p>'}<p id="hNo" class="empty hidden">لا توجد نتائج مطابقة</p><footer>${esc(S.title)}</footer></div>`;
  show('#home')}
home.onclick=e=>{if(e.target.id==='hClose'||e.target.id==='hMap')return showHome(false);const c=e.target.closest('.hcard');if(!c)return;openCard(c.dataset.id)};
function openCard(id){const c=S.cards.find(x=>x.id===id);if(!c)return;
  if(c.lesson&&S.lessons.some(l=>l.id===c.lesson))return openLesson(c.lesson);
  const b=box('cardView',60);b.innerHTML=`${c.img?`<img src="${c.img}" style="width:100%;border-radius:16px" alt="">`:''}<small>${esc([c.type,c.subject].filter(Boolean).join(' · '))}</small><h2>${esc(c.title)}</h2><p style="white-space:pre-wrap;line-height:1.8">${esc(c.desc)}</p><button id="cvX" class="pri">إغلاق</button>`;
  $('#cvX').onclick=()=>close('cardView');show('#cardView')}
/* أول رسم بعد تحميل البيانات: يعرض الرئيسية للزائر إن وُجدت بطاقات منشورة */
const _r=render;let first=1;render=function(){_r();if(first){first=0;if(!admin&&visible().length)showHome(true)}};
new MutationObserver(()=>{if(!$('#bar').classList.contains('hidden')&&!live)showHome(false)}).observe($('#bar'),{attributes:true,attributeFilter:['class']});

/* ===== عرض الدرس المستقل (قراءة فقط) ===== */
function openLesson(id){const L=S.lessons.find(x=>x.id===id);if(!L||(L.pub===false&&!admin))return toast('الدرس غير منشور');
  if(!live)live={nodes:S.nodes,auto:S.auto,admin};
  admin=false;show('#bar',false);show('#home',false);close('cardView');$('#hud').style.display='';
  S.nodes=clone(L.nodes);S.auto=true;render();fit();$('#lT').textContent=L.title;show('#lbar')}
function closeLesson(){if(!live)return;S.nodes=live.nodes;S.auto=live.auto;admin=live.admin;live=null;show('#lbar',false);
  if(admin)show('#bar');render();fit();if(!admin&&visible().length)showHome(true)}
$('#lBack').onclick=closeLesson;

/* ===== نماذج ===== */
const img=(t)=>{$('#fI').onchange=async e=>{if(e.target.files[0]){t.img=await readImg(e.target.files[0]);toast('تمت إضافة الصورة')}};$('#fR').onclick=()=>{delete t.img;toast('حُذفت الصورة')}};
const imgRow='<div class="row"><input type="file" id="fI" accept="image/*"><button id="fR">حذف الصورة</button></div>';
const ok='<div class="row"><button id="fOk" class="pri">حفظ</button><button id="fNo">إلغاء</button></div>';
const chk=(id,l,v)=>`<label class="chk"><input type="checkbox" id="${id}"${v?' checked':''}> ${l}</label>`;

function cardForm(old){const c=old?{...old}:{id:uid(),title:'',desc:'',type:'ملخص',subject:'',latest:true,featured:false,hidden:false},b=fbox();
  b.innerHTML=`<h2>${old?'تعديل البطاقة':'بطاقة جديدة'}</h2><input id="fT" placeholder="العنوان"><textarea id="fD" rows="3" placeholder="الوصف"></textarea><input id="fY" placeholder="نوع المحتوى (ملخص، درس...)"><input id="fS" placeholder="المادة أو الفصل"><small>الدرس المرتبط</small><select id="fL"><option value="">- بدون -</option>${S.lessons.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select>${chk('fa','تظهر في «الأحدث»',c.latest)}${chk('fb','تظهر في «الأبرز»',c.featured)}${chk('fh','مخفية',c.hidden)}${imgRow}${ok}`;
  $('#fT').value=c.title;$('#fD').value=c.desc;$('#fY').value=c.type;$('#fS').value=c.subject;$('#fL').value=c.lesson||'';img(c);
  $('#fNo').onclick=()=>close('frm');
  $('#fOk').onclick=()=>{const t=$('#fT').value.trim();if(!t)return toast('اكتبي عنواناً');
    Object.assign(c,{title:t,desc:$('#fD').value,type:$('#fY').value,subject:$('#fS').value,lesson:$('#fL').value||undefined,latest:$('#fa').checked,featured:$('#fb').checked,hidden:$('#fh').checked});
    if(old)Object.assign(old,c);else{c.ts=Date.now();S.cards.push(c)}close('frm');queueSave();mgr();toast('تم الحفظ')}}

/* ===== حفظ الفرع كدرس مستقل ===== */
let pick=0;
nodesEl.addEventListener('pointerdown',e=>{if(!pick)return;const d=e.target.closest('.node');if(!d)return;
  e.stopImmediatePropagation();e.preventDefault();pick=0;lessonForm(S.nodes.find(x=>x.id===d.dataset.id))},true);
const clear=()=>nodesEl.querySelectorAll('.node').forEach(e=>e.style.outline='');
function lessonForm(n){const rm=sub(n.id),b=fbox();
  rm.forEach(id=>{const e=elOf({id});if(e)e.style.outline='3px solid var(--accent)'});
  b.innerHTML=`<h2>حفظ الفرع كدرس مستقل</h2><small>الفرع المحدد (مؤطّر بالخريطة): ${rm.size} بطاقة بكل فروعها. الخريطة الأصلية لن تتغير، وسيُحفظ الدرس كنسخة مستقلة. الجذر لن يحتفظ برابطه بأي بطاقة خارج الفرع.</small><input id="fT" placeholder="عنوان الدرس"><textarea id="fD" rows="3" placeholder="الوصف"></textarea><input id="fS" placeholder="التصنيف (المادة أو الفصل)">${imgRow}${chk('fh','يظهر في الصفحة الرئيسية',true)}${chk('fa','ضمن «الأحدث»',true)}${chk('fb','ضمن «الأبرز»',false)}${ok}`;
  const t={};img(t);$('#fT').value=n.title;
  $('#fNo').onclick=()=>{clear();close('frm')};
  $('#fOk').onclick=()=>{const title=$('#fT').value.trim();if(!title)return toast('اكتبي عنوان الدرس');
    const map={};rm.forEach(i=>map[i]=uid());
    const nodes=S.nodes.filter(x=>rm.has(x.id)).map(x=>({...clone(x),id:map[x.id],parent:x.id===n.id?null:map[x.parent]}));
    let p=n,dir=null;while(p&&!dir){if(p.dir&&p.dir!=='I')dir=p.dir;p=S.nodes.find(x=>x.id===p.parent)}
    nodes.find(x=>x.parent===null).dir=dir||'L';
    const L={id:uid(),title,desc:$('#fD').value,cat:$('#fS').value,img:t.img,nodes,ts:Date.now(),pub:true};S.lessons.push(L);
    if($('#fh').checked)S.cards.push({id:uid(),title,desc:L.desc,type:'درس',subject:L.cat,img:L.img,lesson:L.id,latest:$('#fa').checked,featured:$('#fb').checked,hidden:false,ts:L.ts});
    clear();close('frm');queueSave();toast('تم إنشاء الدرس ('+nodes.length+' بطاقة)')}}

function lessonEdit(L){const b=fbox(),t={img:L.img};
  b.innerHTML=`<h2>تعديل بيانات الدرس</h2><input id="fT"><textarea id="fD" rows="3"></textarea><input id="fS" placeholder="التصنيف">${imgRow}${chk('fp','منشور',L.pub!==false)}${ok}`;
  $('#fT').value=L.title;$('#fD').value=L.desc||'';$('#fS').value=L.cat||'';img(t);$('#fNo').onclick=()=>close('frm');
  $('#fOk').onclick=()=>{const title=$('#fT').value.trim();if(!title)return toast('اكتبي عنوان الدرس');
    Object.assign(L,{title,desc:$('#fD').value,cat:$('#fS').value,img:t.img,pub:$('#fp').checked});close('frm');queueSave();mgr();toast('تم الحفظ')}}

/* ===== لوحة إدارة الصفحة الرئيسية ===== */
const swap=(a,i,j)=>{if(j<0||j>=a.length)return;const x=a[i];a[i]=a[j];a[j]=x};
function mgr(){const b=box('mgr',70);
  const cr=S.cards.map(c=>`<div class="mrow" data-k="c" data-id="${c.id}"><b>${esc(c.title)}</b><small>${c.hidden?'مخفية':[c.latest&&'أحدث',c.featured&&'أبرز'].filter(Boolean).join('، ')||'غير ظاهرة'}</small><span><button data-a="up">↑</button><button data-a="dn">↓</button><button data-a="hide">${c.hidden?'إظهار':'إخفاء'}</button><button data-a="ed">✎</button><button data-a="rm">✕</button></span></div>`).join('')||'<small>لا توجد بطاقات بعد</small>';
  const lr=S.lessons.map(l=>`<div class="mrow" data-k="l" data-id="${l.id}"><b>${esc(l.title)}</b><small>${l.nodes.length} بطاقة · ${l.pub===false?'غير منشور':'منشور'}</small><span><button data-a="op">فتح</button><button data-a="pub">${l.pub===false?'نشر':'إلغاء النشر'}</button><button data-a="ed">✎</button><button data-a="rm">✕</button></span></div>`).join('')||'<small>لا توجد دروس مستقلة بعد</small>';
  b.innerHTML=`<h2>إدارة الصفحة الرئيسية</h2><div class="row"><button id="mAdd" class="pri">＋ بطاقة</button><button id="mPrev">معاينة الصفحة</button></div><small>ترتيب «الأحدث»</small><div class="chips" id="mO"></div><h3>البطاقات</h3>${cr}<h3>الدروس المستقلة</h3>${lr}<button id="mX">إغلاق</button>`;
  chips($('#mO'),[['auto','تلقائي (بالتاريخ)'],['manual','يدوي']],S.homeOrder||'auto',k=>{S.homeOrder=k;queueSave()});
  $('#mX').onclick=()=>close('mgr');$('#mAdd').onclick=()=>cardForm();$('#mPrev').onclick=()=>{close('mgr');showHome(true,true)};
  b.onclick=async e=>{const bt=e.target.closest('button'),row=bt&&bt.closest('.mrow');if(!row)return;const id=row.dataset.id,a=bt.dataset.a,done=()=>{queueSave();mgr()};
    if(row.dataset.k==='c'){const i=S.cards.findIndex(x=>x.id===id),c=S.cards[i];
      if(a==='up')swap(S.cards,i,i-1),done();else if(a==='dn')swap(S.cards,i,i+1),done();
      else if(a==='hide'){c.hidden=!c.hidden;done()}else if(a==='ed')cardForm(c);
      else if(a==='rm'&&await ask('حذف هذه البطاقة؟ (الدرس المرتبط لا يُحذف)',{ok:'حذف'})){S.cards.splice(i,1);done()}}
    else{const L=S.lessons.find(x=>x.id===id);
      if(a==='op'){close('mgr');openLesson(id)}else if(a==='pub'){L.pub=L.pub===false;done()}else if(a==='ed')lessonEdit(L);
      else if(a==='rm'&&await ask('حذف الدرس المستقل وبطاقاته في الرئيسية؟ لا يؤثر هذا على الخريطة الأصلية.',{ok:'حذف'})){S.lessons=S.lessons.filter(x=>x.id!==id);S.cards=S.cards.filter(c=>c.lesson!==id);done()}}};
  show('#mgr')}

/* ===== أزرار الشريط ===== */
const cs=$('#cs');
[['📋 الصفحة الرئيسية',mgr],['✂ حفظ الفرع كدرس',()=>{if(!S.nodes.length)return toast('لا توجد بطاقات');pick=1;toast('اضغطي على البطاقة الرئيسية للفرع')}]].forEach(([t,f])=>{
  const x=document.createElement('button');x.textContent=t;x.onclick=f;cs.parentNode.insertBefore(x,cs)});
})();


/* ===== إضافة ٤: الثيم الافتراضي الجديد + لون النص على الأزرار ===== */
(()=>{const _a=applyTheme;
applyTheme=function(){if(S.theme==='emerald'&&!S.t2){S.theme='dawn';S.t2=1}
  _a();document.documentElement.style.setProperty('--on',lum(themeObj().acc)>.6?'#1b1b1b':'#fff')};})();

/* ==========================================================
   إضافة ٥: واجهة جديدة — قائمة جانبية ☰، شريط علوي (تراجع/إعادة)،
   دخول مخفي (٥ نقرات سريعة)، ومنع وميض الثيم عند فتح الموقع

(()=>{
const css=document.createElement('style');css.textContent=`

@media(max-width:640px){.hgrid,.hgrid.big{grid-template-columns:1fr}}`;
document.head.appendChild(css);
const bar=$('#bar'),home=$('#home'),mkE=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)p.appendChild(e);return e};
const find=t=>[...bar.querySelectorAll('button')].find(b=>b.textContent.trim()===t);

/* شريط علوي: ☰ + تراجع + إعادة + حالة الحفظ */
const eb=mkE('div','hidden',document.body);eb.id='ebar';
const menu=mkE('button','ib',eb);menu.textContent='☰';menu.setAttribute('aria-label','القائمة');
const un=mkE('button','ib',eb);un.textContent='↶';un.title='تراجع (Ctrl+Z)';un.setAttribute('aria-label','تراجع');un.onclick=()=>find('↶ تراجع').click();
const re=mkE('button','ib',eb);re.textContent='↷';re.title='إعادة (Ctrl+Y)';re.setAttribute('aria-label','إعادة');re.onclick=()=>find('↷ إعادة').click();

const setOpen=v=>{dr.classList.toggle('open',v);sc.classList.toggle('hidden',!v)};
const G=[['الخريطة',['＋ فرع رئيسي','ترتيب تلقائي','✂ حفظ الفرع كدرس']],['المحتوى',['📋 الصفحة الرئيسية','✎ العنوان']],['المظهر',['🎨 الثيمات','Aa الخط والوضع']],['البيانات',['⇅ تصدير/استيراد','⬇ نسخة احتياطية','⟲ استعادة']]];
G.forEach(([h,l],gi)=>{const s=mkE('section','',$('#dB'));mkE('h4','',s).textContent=h;
  l.forEach(t=>{const b=find(t);if(!b)return;const i=mkE('button','di',s);i.textContent=t;i.onclick=()=>{setOpen(false);b.click()}});

menu.onclick=()=>setOpen(!dr.classList.contains('open'));sc.onclick=()=>setOpen(false);$('#dX').onclick=()=>setOpen(false);
